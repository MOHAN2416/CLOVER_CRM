<!DOCTYPE html>
<html lang="en">
<head>
    <script>const API_BASE_URL = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' ? window.location.protocol + "//" + window.location.hostname + ":5000" : "";</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clover CRM | Register Representative</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap');
        
        body { 
            background: #09090B; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            color: #FFFFFF; 
            margin: 0;
            padding: 0;
        }
        .auth-card { 
            max-width: 420px; 
            margin: 100px auto; 
            background: #111113; 
            border: 1px solid rgba(255, 255, 255, 0.06); 
            border-radius: 16px; 
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(16px);
        }
        .form-label {
            color: #E4E4E7 !important;
            font-weight: 500;
            margin-bottom: 6px;
        }
        .text-muted {
            color: #A1A1AA !important;
        }
        .form-control { 
            background: #09090B; 
            border: 1px solid rgba(255, 255, 255, 0.08); 
            color: #FFFFFF; 
            border-radius: 10px;
            padding: 11px 14px;
            font-size: 14px;
        }
        .form-control:focus { 
            background: #09090B; 
            border-color: #00D4FF; 
            color: #FFFFFF; 
            box-shadow: 0 0 10px rgba(0, 212, 255, 0.15); 
        }
        .form-control::placeholder {
            color: #52525B !important;
        }
        .btn-success {
            background: linear-gradient(135deg, #00D4FF 0%, #00E676 100%);
            border: none;
            color: #09090B;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            transition: all 0.2s;
        }
        .btn-success:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(0, 230, 118, 0.25);
            background: linear-gradient(135deg, #00D4FF 0%, #00E676 100%);
            color: #09090B;
        }
        .btn-success:active {
            transform: translateY(0);
        }
        .text-success-gradient {
            background: linear-gradient(135deg, #FFFFFF 30%, #00E676 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 700;
        }
        .link-accent {
            color: #00D4FF !important;
            text-decoration: none;
            font-weight: 600;
        }
        .link-accent:hover {
            color: #00E676 !important;
            text-decoration: underline !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card auth-card shadow p-4 p-md-5 text-white">
            <h3 class="fw-bold text-center text-success-gradient mb-2">Create Account</h3>
            <p class="text-muted small text-center mb-4">Register as a Clover CRM Sales Representative.</p>
            
            <form id="signupForm">
                <div class="mb-3">
                    <label class="form-label small">Username</label>
                    <input type="text" id="username" class="form-control" placeholder="e.g., mohan" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Email Address</label>
                    <input type="email" id="email" class="form-control" placeholder="name@company.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label small">Password</label>
                    <input type="password" id="password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-success w-100 fw-bold mt-3">Register Session</button>
            </form>
            <div id="alertBox" class="alert mt-3 d-none text-center small" role="alert"></div>
            <p class="text-center small text-muted mt-4 mb-0">Already registered? <a href="/login" class="link-accent">Sign In</a></p>
        </div>
    </div>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const alertBox = document.getElementById('alertBox');
            const payload = {
                username: document.getElementById('username').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            const res = await fetch(API_BASE_URL + '/api/signup', {
                credentials: 'include',
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload, {credentials: 'include'})
            });
            const result = await res.json();
            alertBox.classList.remove('d-none', 'alert-success', 'alert-danger');
            
            if (result.status === 'success') {
                alertBox.classList.add('alert-success');
                alertBox.innerText = result.message;
                setTimeout(() => window.location.href = '/login', 1500);
            } else {
                alertBox.classList.add('alert-danger');
                alertBox.innerText = result.message;
            }
        });
    </script>
</body>
</html>
